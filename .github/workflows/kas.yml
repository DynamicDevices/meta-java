name: CI

on:
  push:
    paths-ignore:
      - "README"
      - "**.md"
  pull_request:
     paths-ignore:
      - "README"
      - "**.md"

jobs:
  build:

    timeout-minutes: 600
    runs-on: [self-hosted, linux, X64]
    continue-on-error: true
    container:
      image: dynamicdevices/yocto-ci-build:latest
      options: --privileged --platform linux/amd64  -v /dev/net/tun:/dev/net/tun -v /dev/kvm:/dev/kvm
    strategy:
      matrix:
        yocto-version: [master, styhead, scarthgap, kirkstone]
        java-version: [openjdk-7, openjdk-8]
        machine: [qemuarm64]
    steps:
    - uses: actions/checkout@v4
    - name: Restore sstate cache
      id: cache-sstate-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          sstate
        key: ${{ matrix.machine }}-${{ matrix.yocto-version }}-sstate
    - name: Move sstate
      run: |
        mkdir -p sstate
        mv sstate sstate-cache

    - name: Run kas build on ${{ matrix.machine }} on ${{ matrix.yocto-version }} for ${{ matrix.java-version }}
      run: |
        export SSTATE_DIR="${PWD}/sstate"
        export SSTATE_MIRRORS="file://.* file://${PWD}/sstate-cache/PATH;downloadfilename=PATH"
        kas build kas/meta-java-${{ matrix.yocto-version }}.yml:kas/target-${{ matrix.java-version }}.yml:kas/machine-${{ matrix.machine }}.yml:kas/ci.yml

    - name: Run kas test on ${{ matrix.machine }} on ${{ matrix.yocto-version }} for ${{ matrix.java-version }}
      run: |
        export SSTATE_DIR="${PWD}/sstate"
        export SSTATE_MIRRORS="file://.* file://${PWD}/sstate-cache/PATH;downloadfilename=PATH"
        KAS_TASK=testimage kas build kas/meta-java-${{ matrix.yocto-version }}.yml:kas/target-${{ matrix.java-version }}.yml:kas/machine-${{ matrix.machine }}.yml:kas/ci.yml

    - name: Save sstate cache
      id: cache-sstate-save
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          sstate
        key: ${{ steps.cache-sstate-restore.outputs.cache-primary-key }}
